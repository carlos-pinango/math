<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathématiques</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa; /* Gris très léger pour faire ressortir les cartes */
        }
        header {
            text-align: center;
            padding: 40px 0;
            background: #2c3e50; /* Garde une base sobre et pro */
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 2.2em; }
        p.subtitle { margin-top: 10px; opacity: 0.9; }

        .course-list {
            list-style: none;
            padding: 0;
        }
        .course-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-left: 5px solid #bdc3c7; /* Couleur par défaut grise */
        }
        
        /* Style spécifique pour la Probabilité */
        .item-probabilite:hover {
            transform: translateX(10px);
            border-left: 5px solid #e67e22; /* Le orange uniforme */
        }
        .item-probabilite .course-link {
            color: #e67e22;
        }

        .course-link {
            text-decoration: none;
            font-size: 1.3em;
            font-weight: bold;
            display: block;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            color: #95a5a6;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>Ressources de Mathématiques</h1>
    <p class="subtitle">Sélectionnez une section pour commencer</p>
</header>

<ul class="course-list">
    <li class="course-item item-probabilite">
        <a href="probabilite.html" class="course-link">Probabilité</a>
    </li>
    
    </ul>

<footer>
    &copy; 2026 - Espace d'apprentissage
</footer>

</body>
</html>
