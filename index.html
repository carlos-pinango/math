<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathématiques</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        header {
            text-align: center;
            padding: 40px 0;
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 2.5em; }
        .course-list {
            list-style: none;
            padding: 0;
        }
        .course-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .course-item:hover {
            transform: translateX(10px);
            border-left: 5px solid #3498db;
        }
        .course-link {
            text-decoration: none;
            color: #2980b9;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
        }
        .description {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>Ressources de Mathématiques</h1>
    <p>Sélectionnez une section pour commencer</p>
</header>

<ul class="course-list">
    <li class="course-item">
        <a href="probabilite.html" class="course-link">Probabilité</a>
    </li>

</ul>

<footer>
    <p style="text-align: center; margin-top: 50px; color: #999;">
        &copy; 2026 - Espace d'apprentissage
    </p>
</footer>

</body>
</html>
