<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathématiques</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        header {
            text-align: center;
            padding: 40px 0;
            /* Uniformisation avec le orange de la section Probabilité */
            background: #e67e22; 
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.2);
        }
        h1 { margin: 0; font-size: 2.2em; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        p.subtitle { margin-top: 10px; opacity: 0.95; font-weight: 500; }

        .course-list {
            list-style: none;
            padding: 0;
        }
        .course-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-left: 5px solid #e67e22; /* Ligne orange par défaut */
            display: flex;
            align-items: center;
        }
        
        .course-item:hover {
            transform: translateX(10px);
            background-color: #fffaf5; /* Teinte très légère d'orange au survol */
        }

        .course-link {
            text-decoration: none;
            color: #d35400; /* Orange plus foncé pour la lisibilité du texte */
            font-size: 1.3em;
            font-weight: bold;
            display: block;
            width: 100%;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            color: #95a5a6;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>Ressources de Mathématiques</h1>
</header>

<ul class="course-list">
    <li class="course-item">
        <a href="probabilite.html" class="course-link">Probabilité</a>
    </li>
    
    <li class="course-item">
        <a href="cercle-cylindre.html" class="course-link">Cercle et cylindre</a>
    </li>
</ul>

<footer>
    &copy; 2026 - Espace d'apprentissage
</footer>

</body>
</html>
